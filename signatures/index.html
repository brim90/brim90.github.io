<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signature Preview</title>
  <style>
    :root { --bg: #f4f7f9; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --border: #d6dde2; --accent: #0070c0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15181b; --panel: #1f2327; --text: #f1f3f5; --muted: #a3abb3; --border: #363d44; --accent: #4fb3f0; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; }
    iframe { width: 100%; height: 220px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    textarea { font: 12px ui-monospace, Consolas, monospace; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Water Babies signature preview</h1>
      <p>Shows the signature exactly as the Outlook add-in inserts it. Type any details to check how it copes with long titles or missing numbers.</p>
    </div>
    <div class="panel fields">
      <label>Design <select id="design"></select></label>
      <label>Name <input id="name" value="Dan Brimmicombe"></label>
      <label>Job title <input id="title" value="Associate Director of Technology"></label>
      <label>Office phone <input id="phone" placeholder="switchboard"></label>
      <label>Mobile <input id="mobile" placeholder="none"></label>
    </div>
    <div class="panel">
      <iframe id="preview" title="Signature preview" sandbox=""></iframe>
      <div class="row">
        <button id="copy" type="button">Copy signature</button>
        <span id="status" role="status"></span>
      </div>
      <details>
        <summary>HTML</summary>
        <textarea id="html" rows="6" readonly aria-label="Signature HTML"></textarea>
      </details>
    </div>
  </main>
  <script src="preview.js"></script>
</body>
</html>
