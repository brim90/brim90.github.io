# Signature Manager: publish only the built app, not its sources or tooling.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - signatures/node_modules
  - signatures/src
  - signatures/test
  - signatures/build.mjs
  - signatures/package.json
  - signatures/package-lock.json
  - signatures/README.md
